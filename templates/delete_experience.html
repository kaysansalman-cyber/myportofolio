{% extends 'base.html' %}

{% block title %}
Delete Experience - Kaysan
{% endblock title %}

{% block content %}

<section class="section">

    <div class="container">

        <div class="section-heading">

            <p class="section-label">
                DELETE EXPERIENCE
            </p>

            <h1>
                Hapus Experience
            </h1>

            <p>
                Apakah kamu yakin ingin menghapus experience
                <strong>{{ experience.title }}</strong>?
            </p>

        </div>

        <form method="POST">

            {% csrf_token %}

            <button type="submit">
                Ya, Hapus Experience
            </button>

            <a href="{% url 'main:show_experience' %}">
                Batal
            </a>

        </form>

    </div>

</section>

{% endblock content %}
