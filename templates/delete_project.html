{% extends 'base.html' %}

{% block title %}
Delete Project - Kaysan
{% endblock title %}

{% block content %}

<section class="section">

    <div class="container">

        <div class="section-heading">
            <p class="section-label">DELETE PROJECT</p>

            <h1>Hapus Project</h1>

            <p>
                Apakah kamu yakin ingin menghapus project
                <strong>{{ project.title }}</strong>?
            </p>
        </div>

        <form method="POST">

            {% csrf_token %}

            <button type="submit">
                Ya, Hapus Project
            </button>

            <a href="{% url 'main:show_projects' %}">
                Batal
            </a>

        </form>

    </div>

</section>

{% endblock content %}
