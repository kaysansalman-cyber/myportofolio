{% extends 'base.html' %}

{% block title %}
Edit Project - Kaysan
{% endblock title %}

{% block content %}

<section class="section">

    <div class="container">

        <div class="section-heading">
            <p class="section-label">EDIT PROJECT</p>

            <h1>Edit Project</h1>

            <p>
                Perbarui informasi project
                <strong>{{ project.title }}</strong>.
            </p>
        </div>

        <form method="POST">

            {% csrf_token %}

            <div>
                {{ form.as_p }}
            </div>

            <button type="submit">
                Simpan Perubahan
            </button>

            <a href="{% url 'main:show_projects' %}">
                Batal
            </a>

        </form>

    </div>

</section>

{% endblock content %}
